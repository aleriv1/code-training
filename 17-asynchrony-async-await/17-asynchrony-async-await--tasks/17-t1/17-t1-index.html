<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>17-asynchrony-async-await task 1</title>

</head>

<body>

  <p class="returned-todo">
    <span id="loading">Loading...</span>
  </p>
  <script>/* 
Требуется переписать данный код, использующий .then(), .catch() и .finally() в код, который использует исключительно async/await. и try...catch...finally:

    // const POSTS_URL = "https://jsonplaceholder.typicode.com/posts";
    const POSTS_URL = "https://jsonplaceholder.typicode.com/pjosts"; // catch test
    let isLoading = false;

    const createNewPost = () => {
      isLoading = true;
      fetch(POSTS_URL, {
        method: "POST",
      })
        .then((response) => response.json())
        .then((result) => {
          console.log("result", result);
        })
        .catch((error) => {
          console.log("error", error);
        })
        .finally(() => {
          isLoading = false;
        });
    };
    createNewPost();

    const createNewPostAsync = async () => {
      try {
        isLoading = true;
        const fetchPost = await fetch(POSTS_URL, {
          method: "POST",
        });

        if (!fetchPost.ok) {
          throw new Error("failed request");
        }

        const post = await fetchPost.json();

        console.log("result", post);
        return post;
      } catch (err) {
        console.log("error", err);
      } finally {
        isLoading = false;
      }
    };

    createNewPostAsync()
      .then((post) => {
        const isLoadingEl = document.querySelector("#loading");
        isLoading
          ? (isLoadingEl.style.display = "block")
          : (isLoadingEl.style.display = "none");

        const returnedTodoEl = document.querySelector(".returned-todo");
        returnedTodoEl.textContent = `Post ${post.id} was posted.`;
      })
      .catch(() => {
        console.error("kosyak");
      });
  </script>
</body>

</html>
