<!-- #region Раздел #9. Как добавить JavaScript на вашу страницу? https://lk.result-university.com/pl/teach/control/lesson/view?id=268066550 -->

<script>
  document.addEventListener("DOMContentLoaded", function () {

    function createParagraph() {
      // let para = document.createElement('p');
      const para = document.createElement('p');
      para.textContent = "You clicked the button (script between <script> and <\/script>)";
      document.body.appendChild(para);
    }
    const buttons = document.querySelectorAll('button');

    for (let i = 0; i < buttons.length; i++) { buttons[i].addEventListener('click', createParagraph); }
  }) </script>
